server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: campuscare-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/campuscare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:sa}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:9a7f8d6e5c4b3a210fedcba9876543210123456789abcdef0123456789abcdef}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app,*}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-1.5-flash}
    endpoint: ${AI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-ms: 5000

logging:
  level:
    root: INFO
    com.campuscare: INFO
