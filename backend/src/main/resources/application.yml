server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campuscare-backend
  datasource:
    url: jdbc:mysql://localhost:3306/campuscare?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:varun123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:9a7f8d6e5c4b3a210fedcba9876543210123456789abcdef0123456789abcdef}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-1.5-flash}
    endpoint: ${AI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-ms: 5000

logging:
  level:
    root: INFO
    com.campuscare: INFO
