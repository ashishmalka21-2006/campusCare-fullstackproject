version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: campuscare-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-varun123}
      MYSQL_DATABASE: ${DB_NAME:-campuscare}
      MYSQL_USER: ${DB_USER:-campuscare_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-varun123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - campuscare_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuscare-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campuscare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-varun123}
      JWT_SECRET: ${JWT_SECRET:-9a7f8d6e5c4b3a210fedcba9876543210123456789abcdef0123456789abcdef}
      AI_API_KEY: ${AI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campuscare_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campuscare-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campuscare_network

volumes:
  mysql_data:
    driver: local

networks:
  campuscare_network:
    driver: bridge
